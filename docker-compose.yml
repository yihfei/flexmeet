# Development: only Postgres runs in Docker. Run the apps with `pnpm dev`.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flexmeet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flexmeet}
      POSTGRES_DB: ${POSTGRES_DB:-flexmeet}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER}']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
